name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd server && npm ci
          cd ../client && npm ci

      - name: Syntax check server
        run: node --check server/index.js

      - name: Build client
        run: |
          cd client
          npm run build
